<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abed Tahan – ID Admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--blue:#005EB8;--blue-dark:#004A94;--ink:#1B1F24;--muted:#6B7280;--line:#E5E7EB;--page:#F6F7F9;--paper:#fff;--soft:#FAFAFB;--hover:#FAFCFF;--open:#F3F8FD;--detail:#F9FBFD;--danger-bg:#FEF2F2;--ok:#15803D;--err:#B91C1C;--r:4px;--max:1100px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;line-height:1.5;font-size:15px}
  html[dir="rtl"] body{font-family:"Cairo","Outfit",system-ui,sans-serif}

  header{background:var(--blue);color:#fff}
  .bar{max-width:var(--max);margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bar img{height:65px;width:auto;display:block}
  .bar .right{display:flex;gap:8px}

  .wrap{max-width:var(--max);margin:0 auto;padding:28px 20px 60px}

  /* buttons: one height everywhere */
  button{font-family:inherit;font-size:14px;font-weight:500;height:40px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .btn{background:var(--blue);color:#fff}
  .btn:hover{background:var(--blue-dark)}
  .btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--muted)}
  .btn.danger{background:var(--paper);color:var(--err);border-color:#FECACA}
  .btn.danger:hover{background:var(--danger-bg)}
  .btn.white{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  .btn.white:hover{background:rgba(255,255,255,.12)}
  .btn.sm{height:30px;padding:0 8px;font-size:12px;min-width:58px}

  /* inputs */
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input{width:100%;height:40px;font:inherit;font-size:14px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink)}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,94,184,.12)}
  input[type=file]{padding:8px 12px;line-height:1}

  /* sections */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px}
  .panel-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .panel-h h2{font-size:16px;font-weight:600;margin:0}
  .panel-h span{color:var(--muted);font-weight:400;font-size:14px}
  .panel-b{padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 16px;align-items:end}
  .note{font-size:14px;margin-top:12px;min-height:20px}
  .note.ok{color:var(--ok)} .note.err{color:var(--err)}

  /* stats: one strip, dividers not cards */
  .stats{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px}
  .stat{flex:1;padding:16px 20px;border-inline-start:1px solid var(--line)}
  .stat:first-child{border-inline-start:0}
  .stat b{display:block;font-size:26px;font-weight:600;color:var(--blue);line-height:1.1}
  .stat span{font-size:13px;color:var(--muted)}

  /* login */
  .login{max-width:380px;margin:60px auto}
  .login .panel-b>*{margin-bottom:14px}
  .login .panel-b>*:last-child{margin-bottom:0}

  /* table */
  .tools{display:flex;gap:10px;margin-bottom:14px}
  .tools input{max-width:360px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  th,td{text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  col.c-thumb{width:48px} col.c-id{width:70px} col.c-name{width:26%} col.c-pos{width:32%} col.c-phone{width:120px} col.c-dept{width:22%}
  th{background:var(--soft);color:var(--muted);font-weight:500;font-size:13px;position:sticky;top:0}
  th[data-sort]{cursor:pointer;user-select:none}
  th[data-sort]:hover{color:var(--ink)}
  th[data-sort].asc::after{content:" ▲";font-size:9px} th[data-sort].desc::after{content:" ▼";font-size:9px}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--hover)}
  td.num,th.num{text-align:end}
  td.actions{display:flex;gap:4px;overflow:visible}
  a.link{color:var(--blue);text-decoration:none}
  a.link:hover{text-decoration:underline}
  .thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
  td.thumbcell{width:48px;padding-top:6px;padding-bottom:6px}
  tr.main{cursor:pointer}
  tr.main.open td{background:var(--open)}
  tr.detail td{background:var(--detail);padding:12px 12px 14px;white-space:normal}
  .detail-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .detail-in .lnk{color:var(--muted);font-size:13px;margin-inline-end:auto;overflow-wrap:anywhere}
  .detail-in .lnk a{color:var(--blue);text-decoration:none}
  .io{display:flex;gap:8px;flex-wrap:wrap}
  .preview{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
  .hide{display:none!important}
  @media (max-width:640px){.stat b{font-size:22px}.bar img{height:48px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="https://abedtahan.com/cdn/shop/files/AT_Logo_400x200_Transparent.png?v=1732612010&width=250" alt="Abed Tahan">
    <div class="right">
      <button class="btn white" id="langBtn">عربي</button>
      <button class="btn white hide" id="logoutBtn" data-i="logout">Log out</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel login" id="loginBox">
    <div class="panel-h"><h2 data-i="loginTitle">Employee ID admin</h2></div>
    <div class="panel-b">
      <div><label data-i="username">Username</label><input id="user" autocomplete="username"></div>
      <div><label data-i="password">Password</label><input id="pass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="loginBtn" style="width:100%" data-i="login">Log in</button>
      <div class="note err" id="loginErr"></div>
    </div>
  </div>

  <div id="panel" class="hide">
    <div class="stats">
      <div class="stat"><b id="sEmp">–</b><span data-i="employees">Employees</span></div>
    </div>

    <div class="panel">
      <div class="panel-h"><h2 data-i="addTitle">Add employee</h2></div>
      <div class="panel-b">
        <div class="grid">
          <div><label data-i="name">Full Name</label><input id="aName"></div>
          <div><label data-i="position">Position</label><input id="aPos"></div>
          <div><label data-i="phone">Phone Number</label><input id="aPhone"></div>
          <div><label data-i="punch">Punch ID</label><input id="aId"></div>
          <div><label data-i="department">Department</label><input id="aDept"></div>
          <div><label data-i="photoOpt">Photo (optional)</label><input type="file" id="aFile" accept="image/*"></div>
          <div><button class="btn" id="addBtn" style="width:100%" data-i="add">Add employee</button></div>
        </div>
        <div class="note" id="addMsg"></div>
      </div>
    </div>

    <div class="panel hide" id="editBox">
      <div class="panel-h"><h2><span data-i="editTitle">Edit employee</span> <span id="eTitle"></span></h2></div>
      <div class="panel-b">
        <div class="grid">
          <div><label data-i="name">Full Name</label><input id="eName"></div>
          <div><label data-i="position">Position</label><input id="ePos"></div>
          <div><label data-i="phone">Phone Number</label><input id="ePhone"></div>
          <div><label data-i="department">Department</label><input id="eDept"></div>
          <div><label data-i="photoUrl">Photo URL</label><input id="ePhoto" placeholder="https://…/photos/name.jpg"></div>
          <div><label data-i="uploadPhoto">Upload new photo</label><input type="file" id="eFile" accept="image/*"></div>
          <div><img class="preview" id="ePreview" alt=""></div>
          <div><button class="btn" id="saveBtn" style="width:100%" data-i="save">Save changes</button></div>
          <div><button class="btn ghost" id="cancelBtn" style="width:100%" data-i="cancel">Cancel</button></div>
        </div>
        <div class="note" id="editMsg"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h"><h2 data-i="listTitle">Employees</h2></div>
      <div class="panel-b">
        <div class="tools">
          <input id="search" data-ph="search" placeholder="Search name, ID, department…">
          <button class="btn ghost" id="refreshBtn" data-i="refresh">Refresh</button>
          <span style="flex:1"></span>
          <button class="btn ghost" id="exportBtn" data-i="export">Export CSV</button>
          <button class="btn ghost" id="importBtn" data-i="import">Import CSV</button>
        </div>
        <div class="panel hide" id="importBox" style="margin:0 0 14px">
          <div class="panel-h"><h2 data-i="importTitle">Import employees from CSV</h2><button class="btn ghost sm" id="importClose" data-i="close">Close</button></div>
          <div class="panel-b">
            <p style="margin:0 0 12px;color:var(--muted);font-size:14px" data-i="importHelp">Columns: Full Name, Position, Phone Number, Punch ID, Department, Photo. Punch ID and Full Name are required. Rows whose Punch ID already exists are skipped.</p>
            <div class="io">
              <button class="btn ghost" id="sampleBtn" data-i="sample">Download sample CSV</button>
              <input type="file" id="importFile" accept=".csv,text/csv" style="max-width:320px">
              <button class="btn" id="importRun" data-i="importRun">Import</button>
            </div>
            <div class="note" id="importMsg"></div>
          </div>
        </div>
        <div class="tablewrap">
          <table>
            <colgroup><col class="c-thumb"><col class="c-id"><col class="c-name"><col class="c-pos"><col class="c-phone"><col class="c-dept"></colgroup>
            <thead><tr>
              <th></th><th data-sort="id" data-i="idCol">ID</th><th data-sort="name" data-i="name">Full Name</th><th data-sort="position" data-i="position">Position</th><th data-sort="phone" data-i="phoneCol">Phone</th><th data-sort="department" data-i="department">Department</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="note" id="listMsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token = sessionStorage.getItem("token") || "";
let employees = [];

// ---- language ----
const I18N = {
  en:{toggle:"عربي",logout:"Log out",loginTitle:"Employee ID admin",username:"Username",password:"Password",login:"Log in",
      employees:"Employees",scans:"Total scans",redeemed:"Discounts redeemed",addTitle:"Add employee",name:"Full Name",position:"Position",
      phone:"Phone Number",punch:"Punch ID",department:"Department",photoOpt:"Photo (optional)",add:"Add employee",editTitle:"Edit employee",
      photoUrl:"Photo URL",uploadPhoto:"Upload new photo",save:"Save changes",cancel:"Cancel",listTitle:"Employees",search:"Search name, ID, department…",
      refresh:"Refresh",export:"Export CSV",import:"Import CSV",importTitle:"Import employees from CSV",close:"Close",
      importHelp:"Columns: Full Name, Position, Phone Number, Punch ID, Department, Photo. Punch ID and Full Name are required. Rows whose Punch ID already exists are skipped.",
      sample:"Download sample CSV",importRun:"Import",chooseFile:"Choose a CSV file first.",importing:"Importing {a} of {b}…",imported:"Imported {a}. Skipped {b}.",idCol:"ID",phoneCol:"Phone",scansCol:"Scans",redeemedCol:"Redeemed",link:"Link",open:"Open",copy:"Copy",copied:"Copied",card:"Card",edit:"Edit",remove:"Remove",
      loading:"Loading…",none:"No employees found.",required:"Full Name and Punch ID are required.",added:"Added {n}. Generating card…",
      addedCard:"Added {n}. Card downloaded.",uploading:"Uploading photo…",saving:"Saving…",saved:"Saved.",
      savedPhoto:"Saved. The new photo appears on the site in about a minute.",confirmRemove:"Remove {n} ({id})? Their QR code will stop working.",
      expired:"Session expired, please log in again.",cardFail:"Could not generate card: "},
  ar:{toggle:"English",logout:"تسجيل الخروج",loginTitle:"إدارة بطاقات الموظفين",username:"اسم المستخدم",password:"كلمة المرور",login:"تسجيل الدخول",
      employees:"الموظفون",scans:"إجمالي المسح",redeemed:"الحسومات المستخدمة",addTitle:"إضافة موظف",name:"الاسم الكامل",position:"المنصب",
      phone:"رقم الهاتف",punch:"رقم الموظف",department:"القسم",photoOpt:"الصورة (اختياري)",add:"إضافة موظف",editTitle:"تعديل موظف",
      photoUrl:"رابط الصورة",uploadPhoto:"رفع صورة جديدة",save:"حفظ التغييرات",cancel:"إلغاء",listTitle:"الموظفون",search:"ابحث بالاسم أو الرقم أو القسم…",
      refresh:"تحديث",export:"تصدير CSV",import:"استيراد CSV",importTitle:"استيراد موظفين من ملف CSV",close:"إغلاق",
      importHelp:"الأعمدة: Full Name, Position, Phone Number, Punch ID, Department, Photo. رقم الموظف والاسم الكامل مطلوبان. الصفوف التي يوجد رقمها مسبقاً يتم تجاوزها.",
      sample:"تنزيل نموذج CSV",importRun:"استيراد",chooseFile:"اختر ملف CSV أولاً.",importing:"جارٍ الاستيراد {a} من {b}…",imported:"تم استيراد {a}. تم تجاوز {b}.",idCol:"الرقم",phoneCol:"الهاتف",scansCol:"المسح",redeemedCol:"الحسومات",link:"الرابط",open:"فتح",copy:"نسخ",copied:"تم النسخ",card:"البطاقة",edit:"تعديل",remove:"حذف",
      loading:"جارٍ التحميل…",none:"لا يوجد موظفون.",required:"الاسم الكامل ورقم الموظف مطلوبان.",added:"تمت إضافة {n}. جارٍ إنشاء البطاقة…",
      addedCard:"تمت إضافة {n}. تم تنزيل البطاقة.",uploading:"جارٍ رفع الصورة…",saving:"جارٍ الحفظ…",saved:"تم الحفظ.",
      savedPhoto:"تم الحفظ. ستظهر الصورة الجديدة على الموقع خلال دقيقة تقريباً.",confirmRemove:"حذف {n} ({id})؟ سيتوقف رمز QR الخاص به عن العمل.",
      expired:"انتهت الجلسة، يرجى تسجيل الدخول مجدداً.",cardFail:"تعذّر إنشاء البطاقة: "}
};
let lang = localStorage.getItem("lang") || "en", T = I18N[lang];
const t = (k, v = {}) => Object.entries(v).reduce((s, [a, b]) => s.replace("{" + a + "}", b), T[k] || k);
function applyLang(){
  T = I18N[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T[el.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = T[el.dataset.ph]);
  $("langBtn").textContent = T.toggle;
  if(employees.length) render();
}
$("langBtn").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; localStorage.setItem("lang", lang); applyLang(); });

// ---- api ----
async function api(body){
  const r = await fetch("/api/admin", {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer "+token}, body:JSON.stringify(body)});
  const d = await r.json();
  if(r.status === 401 && body.action !== "login"){ logout(); throw new Error(t("expired")); }
  if(!r.ok || d.error) throw new Error(d.error || "Request failed");
  return d;
}
function showPanel(on){ $("loginBox").classList.toggle("hide", on); $("panel").classList.toggle("hide", !on); $("logoutBtn").classList.toggle("hide", !on); }
function logout(){ token=""; sessionStorage.removeItem("token"); showPanel(false); }

$("loginBtn").addEventListener("click", async () => {
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try{
    const d = await api({action:"login", username:$("user").value.trim(), password:$("pass").value});
    token = d.token; sessionStorage.setItem("token", token);
    showPanel(true); load();
  }catch(e){ $("loginErr").textContent = e.message; }
  $("loginBtn").disabled = false;
});
$("pass").addEventListener("keydown", e => { if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", logout);
$("refreshBtn").addEventListener("click", load);
$("search").addEventListener("input", render);

async function load(){
  $("listMsg").className="note"; $("listMsg").textContent = t("loading");
  try{
    employees = (await api({action:"list"})).employees;
    $("sEmp").textContent = employees.length;
    $("listMsg").textContent = "";
    render();
  }catch(e){ $("listMsg").className="note err"; $("listMsg").textContent = e.message; }
}

let sortKey = "", sortDir = 1;
document.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.sort;
  if(sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
  document.querySelectorAll("th[data-sort]").forEach(x => x.classList.remove("asc","desc"));
  th.classList.add(sortDir === 1 ? "asc" : "desc");
  render();
}));
function render(){
  const q = $("search").value.trim().toLowerCase();
  let list = employees.filter(e => !q || [e.name,e.id,e.position,e.department,e.phone].join(" ").toLowerCase().includes(q));
  if(sortKey){
    const numeric = sortKey === "id";
    list = [...list].sort((a,b) => {
      const va = a[sortKey] ?? "", vb = b[sortKey] ?? "";
      const c = numeric ? (Number(va)||0) - (Number(vb)||0) : String(va).localeCompare(String(vb), undefined, {sensitivity:"base"});
      return c * sortDir;
    });
  }
  $("rows").innerHTML = list.map(e => `
    <tr class="main${openId===e.id?" open":""}" data-id="${esc(e.id)}">
      <td class="thumbcell"><img class="thumb" src="${esc(e.photo || '/photos/default.jpg')}" alt="" loading="lazy" onerror="this.onerror=null;this.src='/photos/default.jpg'"></td>
      <td>${esc(e.id)}</td><td title="${esc(e.name)}">${esc(e.name)}</td><td title="${esc(e.position)}">${esc(e.position)}</td><td>${esc(e.phone)}</td><td title="${esc(e.department)}">${esc(e.department)}</td>
    </tr>
    ${openId===e.id ? `<tr class="detail"><td colspan="6"><div class="detail-in">
      <span class="lnk"><a href="/#${esc(e.code || e.id)}" target="_blank">${location.origin}/#${esc(e.code || e.id)}</a></span>
      <button class="btn ghost sm copy" data-link="${location.origin}/#${esc(e.code || e.id)}">${t("copy")}</button>
      <button class="btn ghost sm card" data-id="${esc(e.id)}">${t("card")}</button>
      <button class="btn ghost sm edit" data-id="${esc(e.id)}">${t("edit")}</button>
      <button class="btn danger sm danger" data-id="${esc(e.id)}" data-name="${esc(e.name)}">${t("remove")}</button>
    </div></td></tr>` : ""}`).join("") || `<tr><td colspan="6" style="color:var(--muted)">${t("none")}</td></tr>`;
  $("rows").querySelectorAll("tr.main").forEach(r => r.addEventListener("click", () => { openId = openId === r.dataset.id ? "" : r.dataset.id; render(); }));
  $("rows").querySelectorAll("button.danger").forEach(b => b.addEventListener("click", () => remove(b.dataset.id, b.dataset.name)));
  $("rows").querySelectorAll("button.edit").forEach(b => b.addEventListener("click", () => openEdit(employees.find(e => e.id === b.dataset.id))));
  $("rows").querySelectorAll("button.card").forEach(b => b.addEventListener("click", () => makeCard(employees.find(e => e.id === b.dataset.id), b)));
  $("rows").querySelectorAll("button.copy").forEach(b => b.addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(b.dataset.link); b.textContent = t("copied"); setTimeout(()=>b.textContent=t("copy"),1200); }catch(e){ prompt("Copy link:", b.dataset.link); }
  }));
}
let openId = "";

// ---- export / import ----
const CSV_HEAD = ["Full Name","Position","Phone Number","Punch ID","Department","Photo"];
const csvCell = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function downloadCsv(name, rows){
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
$("exportBtn").addEventListener("click", () => {
  downloadCsv("employees.csv", [[...CSV_HEAD,"Link"], ...employees.map(e => [e.name,e.position,e.phone,e.id,e.department,e.photo||"",`${location.origin}/#${e.code||e.id}`])]);
});
$("sampleBtn").addEventListener("click", () => {
  downloadCsv("employees-sample.csv", [CSV_HEAD, ["Jad Khoury","Sales Executive","71-123456","2400","Mazraa Branch",""], ["Rana Saad","Cashier","03-654321","2401","Rabieh Branch",""]]);
});
$("importBtn").addEventListener("click", () => $("importBox").classList.toggle("hide"));
$("importClose").addEventListener("click", () => $("importBox").classList.add("hide"));
function parseCsv(text){
  const rows = [], row = []; let cell = "", q = false;
  const push = () => { row.push(cell); cell = ""; };
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === ",") push();
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; push(); rows.push(row.splice(0)); }
    else cell += c;
  }
  if(cell !== "" || row.length){ push(); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim()));
}
const normKey = k => String(k).trim().toLowerCase().replace(/[^a-z0-9]/g,"");
$("importRun").addEventListener("click", async () => {
  const m = $("importMsg"); m.className = "note";
  const f = $("importFile").files[0];
  if(!f){ m.className = "note err"; m.textContent = t("chooseFile"); return; }
  const text = (await f.text()).replace(/^\ufeff/, "");
  const [head, ...body] = parseCsv(text);
  const keys = head.map(normKey);
  const col = (r, ...names) => { for(const n of names){ const i = keys.indexOf(n); if(i >= 0 && r[i] !== undefined) return r[i].trim(); } return ""; };
  const existing = new Set(employees.map(e => e.id));
  let done = 0, skipped = 0;
  $("importRun").disabled = true;
  for(let i = 0; i < body.length; i++){
    const r = body[i];
    const employee = { name: col(r,"fullname","name"), position: col(r,"position"), phone: col(r,"phonenumber","phone"), id: col(r,"punchid","id"), department: col(r,"department","location") };
    const photo = col(r,"photo","photourl");
    m.textContent = t("importing", {a:i+1, b:body.length});
    if(!employee.id || !employee.name || existing.has(employee.id)){ skipped++; continue; }
    try{
      await api({action:"add", employee});
      if(photo) await api({action:"update", id: employee.id, fields:{photo}});
      existing.add(employee.id); done++;
    }catch(e){ skipped++; }
  }
  $("importRun").disabled = false;
  m.className = "note ok"; m.textContent = t("imported", {a:done, b:skipped});
  $("importFile").value = "";
  load();
});

async function remove(id, name){
  if(!confirm(t("confirmRemove", {n:name, id}))) return;
  try{ await api({action:"remove", id}); load(); }
  catch(e){ $("listMsg").className="note err"; $("listMsg").textContent = e.message; }
}

// ---- add ----
$("addBtn").addEventListener("click", async () => {
  const employee = {name:$("aName").value.trim(), position:$("aPos").value.trim(), phone:$("aPhone").value.trim(), id:$("aId").value.trim(), department:$("aDept").value.trim()};

    ["aName","aPos","aPhone","aId","aDept","aFile"].forEach(i => $(i).value="");
    m.className="note ok"; m.textContent = t("added", {n: employee.name});

});

let editing = null;
function openEdit(e){
  if(!e) return; editing = e;
  $("eTitle").textContent = `— ${e.name} (${e.id})`;
  $("eName").value = e.name || ""; $("ePos").value = e.position || ""; $("ePhone").value = e.phone || "";
  $("eDept").value = e.department || ""; $("ePhoto").value = e.photo || ""; $("eFile").value = "";
  $("ePreview").src = e.photo || "/photos/default.jpg";
  $("editMsg").className = "note"; $("editMsg").textContent = "";
  $("editBox").classList.remove("hide"); $("editBox").scrollIntoView({behavior:"smooth"});
}
$("cancelBtn").addEventListener("click", () => { $("editBox").classList.add("hide"); editing = null; });
$("eFile").addEventListener("change", () => { const f = $("eFile").files[0]; if(f) $("ePreview").src = URL.createObjectURL(f); });
function fileToJpeg(file){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const S = 600, c = document.createElement("canvas"); c.width = S; c.height = S;
      const ctx = c.getContext("2d"); const s = Math.max(S/img.width, S/img.height), w = img.width*s, h = img.height*s;
      ctx.drawImage(img, (S-w)/2, (S-h)*0.3, w, h);
      res(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
$("saveBtn").addEventListener("click", async () => {
  if(!editing) return;
  const m = $("editMsg"); m.className = "note"; m.textContent = t("saving"); $("saveBtn").disabled = true;
  try{
    const fields = { name:$("eName").value.trim(), position:$("ePos").value.trim(), phone:$("ePhone").value.trim(), department:$("eDept").value.trim(), photo:$("ePhoto").value.trim() };
    const f = $("eFile").files[0];
    if(f){ m.textContent = t("uploading"); const image = await fileToJpeg(f); const r = await api({ action:"upload", id: editing.id, image }); fields.photo = r.url; }
    await api({ action:"update", id: editing.id, fields });
    m.className = "note ok"; m.textContent = f ? t("savedPhoto") : t("saved");
    await load();
  }catch(e){ m.className = "note err"; m.textContent = e.message; }
  $("saveBtn").disabled = false;
});

// ---- card generator (uses /card-template.png) ----
const TEMPLATE = "/card-template.png", BLUE = "#005EB8", NAVY = "#1B2A4A";
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => rej(new Error("could not load " + src)); i.src = src; }); }
function wrap(ctx, text, maxW){
  const words = text.split(" "), lines = []; let line = "";
  for(const w of words){ const tt = line ? line + " " + w : w; if(ctx.measureText(tt).width > maxW && line){ lines.push(line); line = w; } else line = tt; }
  if(line) lines.push(line); return lines;
}
async function makeCard(e, btn){
  if(!e) return;
  if(btn){ btn.disabled = true; btn.textContent = "…"; }
  try{
    await document.fonts.load("700 32px Outfit"); await document.fonts.load("400 22px Outfit");
    const tpl = await loadImg(TEMPLATE);
    const c = document.createElement("canvas"); c.width = tpl.width; c.height = tpl.height;
    const ctx = c.getContext("2d"); ctx.drawImage(tpl, 0, 0);
    let size = 32; ctx.fillStyle = BLUE; ctx.textBaseline = "alphabetic";
    do { ctx.font = `700 ${size}px Outfit`; size -= 2; } while(ctx.measureText(e.name).width > 500 && size > 18);
    ctx.fillText(e.name, 78, 252);
    ctx.fillStyle = NAVY; ctx.font = "400 22px Outfit";
    wrap(ctx, e.position || "", 480).slice(0, 2).forEach((l, i) => ctx.fillText(l, 78, 300 + i * 32));
    ctx.fillStyle = NAVY; ctx.font = "400 30px Outfit"; ctx.fillText(e.id, 768, 529);
    const cx = 768, cy = 260, r = 171;
    let ph = null; try { ph = await loadImg(e.photo || "/photos/default.jpg"); } catch(x){ try { ph = await loadImg("/photos/default.jpg"); } catch(y){} }
    if(ph){
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
      const s = Math.max(2*r/ph.width, 2*r/ph.height), w = ph.width*s, h = ph.height*s;
      ctx.drawImage(ph, cx - w/2, cy - r - (h - 2*r)*0.3, w, h); ctx.restore();
    }
    const holder = document.createElement("div");
    new QRCode(holder, { text: `${location.origin}/#${e.code || e.id}`, width: 408, height: 408, correctLevel: QRCode.CorrectLevel.M });
    await new Promise(r => setTimeout(r, 50));
    const qc = holder.querySelector("canvas") || holder.querySelector("img");
    ctx.drawImage(qc, 73, 371, 204, 204);
    const pdf = new jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: [85.6, 54] });
    pdf.addImage(c.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 85.6, 54);
    pdf.save(`${e.id}.pdf`);
  }catch(err){ alert(t("cardFail") + err.message); }
  if(btn){ btn.disabled = false; btn.textContent = t("card"); }
}
