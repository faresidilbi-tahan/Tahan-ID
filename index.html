<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abed Tahan – Employee</title>
<meta name="robots" content="noindex">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  body{margin:0;background:#fff;color:#1B1F24;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:420px;margin:0 auto;padding:40px 20px}
  h1{font-size:22px;margin:0 0 20px}
  dl{margin:0;display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:16px}
  dt{color:#6B7280} dd{margin:0;font-weight:500;overflow-wrap:anywhere}
  .msg{color:#6B7280;font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="msg">Loading…</p></div>

<script>
// Google Sheet → File → Share → Publish to web → sheet → CSV → paste link here
const SHEET_CSV_URL = "";

// Sample data used while SHEET_CSV_URL is empty
const SAMPLE = [
  {"Full Name":"Fares Haddad","Position":"Digital Marketing & E-commerce","Phone Number":"+961 3 000 000","Punch ID":"1001","Location":"Mazraa"},
  {"Full Name":"Nour Saleh","Position":"Customer Service Agent","Phone Number":"+961 3 111 111","Punch ID":"1002","Location":"Rabieh"}
];

const app = document.getElementById("app");
const norm = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]/g,"");
function col(row, ...names){
  for(const n of names){
    const k = Object.keys(row).find(k => norm(k) === n);
    if(k && String(row[k]).trim()) return String(row[k]).trim();
  }
  return "—";
}

function render(r){
  app.innerHTML = `
    <h1>${col(r,"fullname","fullnameenglish","name")}</h1>
    <dl>
      <dt>Position</dt><dd>${col(r,"position","title")}</dd>
      <dt>Phone</dt><dd>${col(r,"phonenumber","phone","mobile")}</dd>
      <dt>Punch ID</dt><dd>${col(r,"punchid","punchidnumber","id")}</dd>
      <dt>Location</dt><dd>${col(r,"location","branch")}</dd>
    </dl>`;
}

async function load(){
  const id = location.hash.slice(1).trim() || new URLSearchParams(location.search).get("id") || "";
  if(!id){ app.innerHTML = '<p class="msg">No employee ID in this link.</p>'; return; }
  let rows;
  try{
    if(SHEET_CSV_URL){
      const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?")?"&":"?") + "t=" + Date.now(), {cache:"no-store"});
      if(!res.ok) throw 0;
      rows = Papa.parse(await res.text(), {header:true, skipEmptyLines:true}).data;
    } else rows = SAMPLE;
  }catch(e){ app.innerHTML = '<p class="msg">Could not load employee data. Please try again.</p>'; return; }
  const row = rows.find(r => col(r,"punchid","punchidnumber","id") === id);
  row ? render(row) : (app.innerHTML = `<p class="msg">No employee found for ID ${id}.</p>`);
}
window.addEventListener("hashchange", load);
load();
</script>
</body>
</html>
