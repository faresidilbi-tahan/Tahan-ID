<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abed Tahan – Employee</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:rgb(0,94,184);--bg:#fff;--ink:#1B1F24;--muted:#6B7280;--line:#F0F0F0;--box:whitesmoke;--ok:#15803D}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
  header{background:var(--blue);padding:10px 20px;display:flex;align-items:center;justify-content:center;position:relative}
  .lang{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:6px 12px;font-family:inherit;font-size:14px;cursor:pointer}
  html[dir="rtl"] .lang{right:auto;left:16px}
  html[dir="rtl"] body{font-family:"Cairo","Outfit",sans-serif}
  header img{height:65px;width:auto;display:inline-block}
  .wrap{max-width:420px;margin:0 auto;padding:32px 20px}
  .confirm{display:flex;align-items:center;gap:10px;background:var(--box);backdrop-filter:blur(12px);border:1px solid var(--box);color:var(--ink);border-radius:4px;padding:12px 14px;margin-bottom:24px;font-size:15px;font-weight:500}
  .confirm svg{width:20px;height:20px;flex:none}
  .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:0 0 18px;border:3px solid var(--blue)}
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0 0 20px}
  dl{margin:0;display:grid;grid-template-columns:120px 1fr;gap:0 16px;font-size:16px}
  dt,dd{padding:10px 0;border-bottom:1px solid var(--line)}
  dt{color:var(--muted);font-weight:400} dd{margin:0;font-weight:500;overflow-wrap:anywhere}
  .msg{color:var(--muted);font-size:16px}
</style>
</head>
<body>
<header><img src="https://abedtahan.com/cdn/shop/files/AT_Logo_400x200_Transparent.png?v=1732612010&width=250" alt="Abed Tahan"><button class="lang" id="langBtn">عربي</button></header>
<div class="wrap" id="app"><p class="msg">Loading…</p></div>

<script>
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row = (label, v) => v ? `<dt>${label}</dt><dd>${esc(v)}</dd>` : "";
let currentCode = "";
const I18N = {
  en:{verified:"Verified: this person is a current Abed Tahan employee.",position:"Position",phone:"Phone",punch:"Punch ID",department:"Department",
      invalid:"Invalid link.",notfound:"No employee found for this link.",error:"Could not load employee data. Please try again.",loading:"Loading…",toggle:"عربي"},
  ar:{verified:"تم التحقق: هذا الشخص موظف حالي في عبد طحان.",position:"المنصب",phone:"الهاتف",punch:"رقم الموظف",department:"القسم",
      invalid:"الرابط غير صالح.",notfound:"لم يتم العثور على موظف لهذا الرابط.",error:"تعذّر تحميل بيانات الموظف. حاول مرة أخرى.",loading:"جارٍ التحميل…",toggle:"English"}
};
let lang = localStorage.getItem("lang") || "en";
let T = I18N[lang];
function applyLang(){
  T = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langBtn").textContent = T.toggle;
}
document.getElementById("langBtn").addEventListener("click", () => { lang = lang === "en" ? "ar" : "en"; localStorage.setItem("lang", lang); applyLang(); load(); });
applyLang();

async function load(){
  currentCode = location.hash.slice(1).trim() || new URLSearchParams(location.search).get("id") || "";
  if(!currentCode){ app.innerHTML = `<p class="msg">${T.invalid}</p>`; return; }
  app.innerHTML = `<p class="msg">${T.loading}</p>`;
  try{
    const res = await fetch("/api/employee?id=" + encodeURIComponent(currentCode));
    if(res.status === 404){ app.innerHTML = `<p class="msg">${T.notfound}</p>`; return; }
    if(!res.ok) throw 0;
    const e = await res.json();
    app.innerHTML = `
      <div class="confirm"><span>${T.verified}</span></div>
      <img class="photo" src="${esc(e.photo || '/photos/default.jpg')}" alt="" onerror="this.onerror=null;this.src='/photos/default.jpg'">
      <h1>${esc(e.name)}</h1>
      <dl>
        ${row(T.position, e.position)}
        ${row(T.phone, e.phone)}
        ${row(T.punch, e.id)}
        ${row(T.department, e.department)}
      </dl>
`;
  }catch(e){ app.innerHTML = `<p class="msg">${T.error}</p>`; }
}

window.addEventListener("hashchange", load);
load();
</script>
</body>
</html>
